<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>WartuneLab</title>
  <link rel="stylesheet" href="../styles/bar.css">
</head>
<body>
  <div id="titulo">
    <div id="marca"><b>WartuneLab</b></div>
    <div id="info" class="info">
      <span class="dato">Servidor: <span id="srv">-</span></span>
      <span class="dato">Personaje: <span id="pj">-</span></span>
      <span class="dato">Nivel: <span id="nv">-</span></span>
      <span class="dato">Hora: <span id="hora">--:--:--</span></span>
      <span class="dato ping">Ping: <span id="ping">—</span></span>
    </div>
    <button class="chip-multi" id="multicuentas" title="Abrir otra cuenta">+ Multicuentas</button>
    <div id="controles">
      <button class="ctl" id="min" title="Minimizar">&#9472;</button>
      <button class="ctl" id="max" title="Maximizar">&#9633;</button>
      <button class="ctl cerrar" id="cerrar" title="Cerrar">&#10005;</button>
    </div>
  </div>

  <script>
    const wl = window.api || {};
    const $ = (id) => document.getElementById(id);

    $('min').addEventListener('click', () => wl.minimizar && wl.minimizar());
    $('max').addEventListener('click', () => wl.maximizar && wl.maximizar());
    $('cerrar').addEventListener('click', () => wl.pedirCerrar && wl.pedirCerrar());
    $('titulo').addEventListener('dblclick', (e) => {
      if (!e.target.closest('#controles') && wl.maximizar) wl.maximizar();
    });

    (async () => {
      const d = await wl.datosBarra();
      if (!d) return;
      $('srv').textContent = d.serverName;
      $('pj').textContent = d.personaje || 'Sin crear';
      $('nv').textContent = d.nivel != null ? d.nivel : '—';
      const desfase = d.serverDate ? Date.parse(d.serverDate) - Date.now() : 0;
      const pintar = () => { $('hora').textContent = new Date(Date.now() + desfase).toLocaleTimeString('es-ES'); };
      pintar();
      setInterval(pintar, 1000);
    })();

    document.getElementById('multicuentas').addEventListener('click', async () => {
      const btn = document.getElementById('multicuentas');
      const etiqueta = btn.textContent;
      try {
        const res = await wl.multicuentas();
        if (res && res.ok === false) {
          btn.textContent = res.error || 'Máximo de cuentas';
          btn.disabled = true;
          setTimeout(() => { btn.textContent = etiqueta; btn.disabled = false; }, 2200);
        }
      } catch (e) { /* sin conexión con el proceso principal */ }
    });

    const refrescarPing = async () => {
      if (!wl.metricas) return;
      try {
        const m = await wl.metricas();
        $('ping').textContent = m.ping == null ? '—' : m.ping + ' ms';
      } catch (e) { /* se mantiene el último valor */ }
    };
    refrescarPing();
    setInterval(refrescarPing, 1000);
  </script>
</body>
</html>
