<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cerrar ventana</title>
  <link rel="stylesheet" href="../styles/cerrar.css">
</head>
<body>
  <div class="panel">
    <div class="cabecera" aria-hidden="false">
      <p class="titulo">Cerrar ventana</p>
      <p class="sub">Salir cierra solo esta cuenta. Las demás siguen abiertas.</p>
    </div>
    <div class="botones">
      <button type="button" class="btn" id="cancelar">Cancelar</button>
      <button type="button" class="btn btn-salir" id="salir">Salir</button>
    </div>
  </div>
  <script>
    const elegir = (opcion) => window.api && window.api.elegirCerrar(opcion);

    document.getElementById('cancelar').addEventListener('click', () => elegir('cancelar'));
    document.getElementById('salir').addEventListener('click', () => elegir('salir'));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') elegir('cancelar');
      if (e.key === 'Enter') elegir('salir');
    });
  </script>
</body>
</html>
